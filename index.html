<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>치지직 LoL 티어 인증 시스템</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>치지직 x 롤 티어 인증</h2>
        <p class="description">인증을 완료하면 스트리머 방송 화면 채팅창에 본인의 롤 티어 뱃지가 표시됩니다.</p>
        
        <div class="form-group">
            <label for="chzzkId">1. 치지직 고유 식별자 (chzzk_id)</label>
            <input type="text" id="chzzkId" name="chzzkId" placeholder="치지직 주소창의 고유 ID 입력">
        </div>
        <div class="form-group">
            <label for="riotName">2. 리그 오브 레전드 닉네임</label>
            <input type="text" id="riotName" name="riotName" placeholder="예: 길가던미니언">
        </div>
        <div class="form-group">
            <label for="riotTag">3. 라이엇 태그 (Tag)</label>
            <input type="text" id="riotTag" name="riotTag" placeholder="예: KR1 (## 제외)">
        </div>
        
        <div class="instruction-box">
            <p class="instruction-title">💡 인증 방법</p>
            <p>롤 클라이언트를 실행한 후, 본인의 프로필 아이콘을 아래의 **지정된 아이콘 번호**로 변경하고 확인 버튼을 눌러주세요.</p>
            <h1 id="randomIconNumber"></h1>
            <p class="sub-text">(인증 완료 후에는 원래 아이콘으로 바꾸셔도 됩니다)</p>
        </div>
        
        <button id="verifyButton">티어 인증하기</button>
        <p id="statusMessage"></p>
    </div>
    <script>
        // Generate a random icon number between 1 and 28 for verification
        const randomIcon = Math.floor(Math.random() * 28) + 1;
        document.getElementById('randomIconNumber').innerText = randomIcon + "번 아이콘";

        // Add event listener to the verification button
        document.getElementById('verifyButton').addEventListener('click', async () => {
            const chzzkId = document.getElementById('chzzkId').value;
            const riotName = document.getElementById('riotName').value;
            const riotTag = document.getElementById('riotTag').value;
            const statusMessage = document.getElementById('statusMessage');

            // Validate user input fields
            if (!chzzkId || !riotName || !riotTag) {
                statusMessage.innerText = '모든 항목을 정확히 입력해 주세요.';
                statusMessage.style.color = '#ff3d00';
                return;
            }

            statusMessage.innerText = '라이엇 서버에서 프로필 아이콘 및 티어를 확인 중입니다...';
            statusMessage.style.color = '#333333';

            try {
                // Call the Vercel serverless backend function
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chzzkId: chzzkId,
                        riotName: riotName,
                        riotTag: riotTag,
                        expectedIcon: randomIcon
                    })
                });

                const data = await response.json();

                // Display result based on backend response
                if (response.ok && data.success) {
                    statusMessage.innerText = '🎉 인증 성공! 조회된 티어: ' + data.tier;
                    statusMessage.style.color = '#00c853';
                } else {
                    let errorMsg = '인증에 실패했습니다. ';
                    if (data.error === 'Icon does not match') {
                        errorMsg += '롤 클라이언트의 프로필 아이콘이 지정된 번호와 다릅니다.';
                    } else if (data.error === 'Riot account not found') {
                        errorMsg += '존재하지 않는 라이엇 계정입니다.';
                    } else {
                        errorMsg += (data.error || '입력 정보를 다시 확인해 주세요.');
                    }
                    statusMessage.innerText = errorMsg;
                    statusMessage.style.color = '#ff3d00';
                }
            } catch (error) {
                statusMessage.innerText = '서버 통신 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
                statusMessage.style.color = '#ff3d00';
            }
        });
    </script>
</body>
</html>
