<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>치지직 롤 티어 인증 시스템</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>티어 인증</h2>
        <p class="description">스트리머 방송 화면 채팅창에 티어 뱃지를 표시합니다</p>
        
        <div class="form-group">
            <label for="chzzkId">치지직 고유 식별자</label>
            <p class="help-text">우측 상단 프로필 내 채널 클릭 후 주소창 마지막 영문 숫자 조합 복사</p>
            <input type="text" id="chzzkId" name="chzzkId" placeholder="예 f1bacbddb031c474204b1a45889cec5b">
        </div>
        <div class="form-group">
            <label for="riotName">리그 오브 레전드 닉네임</label>
            <input type="text" id="riotName" name="riotName">
        </div>
        <div class="form-group">
            <label for="riotTag">라이엇 태그</label>
            <input type="text" id="riotTag" name="riotTag" placeholder="예 KR1">
        </div>
        
        <div class="instruction-box">
            <p class="instruction-title">인증 방법</p>
            <p>1. 롤 클라이언트에서 본인의 프로필 아이콘을 아래 이미지로 변경해주세요</p>
            <p style="color: #d32f2f; font-weight: bold; margin: 8px 0;">2. (필수) 변경 후 롤 클라이언트를 로그아웃하고 다시 로그인해야 서버에 즉시 반영됩니다</p>
            <p>3. 재접속 후 아래 확인 버튼을 눌러주세요</p>
            <img id="iconImage" src="" alt="Profile Icon" width="100" height="100">
        </div>
        
        <button id="verifyButton">티어 인증하기</button>
        <p id="statusMessage"></p>
    </div>
    <script>
        // Generate a random icon number and set image source
        const randomIcon = Math.floor(Math.random() * 28) + 1;
        document.getElementById('iconImage').src = 'https://ddragon.leagueoflegends.com/cdn/14.10.1/img/profileicon/' + randomIcon + '.png';

        // Add event listener to the verification button
        document.getElementById('verifyButton').addEventListener('click', async () => {
            const chzzkId = document.getElementById('chzzkId').value;
            const riotName = document.getElementById('riotName').value;
            const riotTag = document.getElementById('riotTag').value;
            const statusMessage = document.getElementById('statusMessage');

            // Validate user input fields
            if (!chzzkId || !riotName || !riotTag) {
                statusMessage.innerText = '모든 항목을 정확히 입력해 주세요';
                statusMessage.style.color = '#ff3d00';
                return;
            }

            statusMessage.innerText = '서버에서 확인 중입니다...';
            statusMessage.style.color = '#333333';

            try {
                // Call the Vercel serverless backend function
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chzzkId: chzzkId,
                        riotName: riotName,
                        riotTag: riotTag,
                        expectedIcon: randomIcon
                    })
                });

                const data = await response.json();

                // Display result based on backend response
                if (response.ok && data.success) {
                    statusMessage.innerText = '인증 성공! 조회된 티어: ' + data.tier;
                    statusMessage.style.color = '#00c853';
                } else {
                    let errorMsg = '인증에 실패했습니다. ';
                    if (data.error === 'Icon does not match') {
                        errorMsg += '라이엇 서버 동기화 대기 중입니다. 현재 인식된 아이콘: ' + data.currentIcon + ' (요구 아이콘: ' + data.expectedIcon + ') 로그아웃 후 재접속을 진행해 주세요.';
                    } else if (data.error === 'Riot account not found') {
                        errorMsg += '존재하지 않는 계정입니다.';
                    } else if (data.error === 'Environment variables missing') {
                        errorMsg += '서버 환경변수가 누락되었습니다.';
                    } else if (data.error === 'Riot API Key expired or invalid') {
                        errorMsg += '라이엇 API 키가 만료되었습니다. 개발자 포털에서 키를 갱신해주세요.';
                    } else {
                        // DB 저장 실패 등 기타 구체적 에러 출력
                        errorMsg += data.error;
                    }
                    statusMessage.innerText = errorMsg;
                    statusMessage.style.color = '#ff3d00';
                }
            } catch (error) {
                statusMessage.innerText = '서버 통신 중 오류가 발생했습니다.';
                statusMessage.style.color = '#ff3d00';
            }
        });
    </script>
</body>
</html>
