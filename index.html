<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tier Verification</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Riot Account Verification</h2>
        <div class="form-group">
            <label for="riotName">Riot Name</label>
            <input type="text" id="riotName" name="riotName">
        </div>
        <div class="form-group">
            <label for="riotTag">Riot Tag</label>
            <input type="text" id="riotTag" name="riotTag">
        </div>
        <div class="form-group">
            <p>Change your profile icon to the number below in LoL client</p>
            <h1 id="randomIconNumber"></h1>
        </div>
        <button id="verifyButton">Verify</button>
        <p id="statusMessage"></p>
    </div>
    <script>
        // Generate a random icon number between 1 and 28 for verification
        const randomIcon = Math.floor(Math.random() * 28) + 1;
        document.getElementById('randomIconNumber').innerText = randomIcon;
    </script>
</body>
</html>
